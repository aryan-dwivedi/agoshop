# The portable deployment artifact: postgres, redis, two stateless API replicas, two
# worker replicas (leader-elected singleton loops), and nginx in front.
#
# Run from the repo root:  docker compose -f infra/docker-compose.yml --env-file .env up --build
#
# PUBLIC_API_URL is fixed to http://localhost:8080 below (nginx front door). Do not rely on
# npm-dev PUBLIC_API_URL from .env — that value is for `npm run dev` / Vite, not this stack.
#
# Two invariants this file exists to enforce:
#   1. ONE named volume `recordings` is mounted into api1, api2, worker AND nginx at
#      RECORDING_LOCAL_DIR, so upload, replay, retention deletion and static serving all
#      address the same bytes regardless of which replica handled the request.
#   2. TWO `worker` replicas share stream consumers via partitioned groups; singleton
#      timers (aggregates, sampling, sweeps, retention) run only on the Redis leader.

name: live-commerce

x-api-env: &api-env
    NODE_ENV: production
    PORT: 8787
    PUBLIC_API_URL: http://localhost:8080
    # Customer, seller, and support Vite dev servers. The API splits on commas.
    WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173,http://localhost:5174,http://localhost:5175}
    DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/live_commerce
    PG_POOL_MAX: ${PG_POOL_MAX:-20}
    REDIS_URL: redis://redis:6379
    SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET:?set SESSION_COOKIE_SECRET in .env}
    AGORA_APP_ID: ${AGORA_APP_ID:?set AGORA_APP_ID in .env}
    AGORA_APP_CERTIFICATE: ${AGORA_APP_CERTIFICATE:?set AGORA_APP_CERTIFICATE in .env}
    AGORA_CUSTOMER_ID: ${AGORA_CUSTOMER_ID:-}
    AGORA_CUSTOMER_SECRET: ${AGORA_CUSTOMER_SECRET:-}
    AGORA_WEBHOOK_SECRET: ${AGORA_WEBHOOK_SECRET:-}
    CONVO_LLM_SHARED_SECRET: ${CONVO_LLM_SHARED_SECRET:?set CONVO_LLM_SHARED_SECRET in .env}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    # Must match the mount path below in every service, including nginx.
    RECORDING_LOCAL_DIR: /var/lib/live-commerce/recordings

services:
    postgres:
        # Postgres 16 is required, not incidental: cart uniqueness uses
        # `UNIQUE NULLS NOT DISTINCT`.
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: live_commerce
        ports: ['127.0.0.1:5432:5432']
        volumes: ['pgdata:/var/lib/postgresql/data']
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d live_commerce']
            interval: 5s
            timeout: 3s
            retries: 12

    redis:
        image: redis:7-alpine
        command: ['redis-server', '--appendonly', 'yes']
        ports: ['127.0.0.1:6379:6379']
        volumes: ['redisdata:/data']
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 12

    api1: &api
        build:
            context: ..
            dockerfile: apps/api/Dockerfile
        environment: *api-env
        volumes: ['recordings:/var/lib/live-commerce/recordings']
        depends_on:
            postgres: { condition: service_healthy }
            redis: { condition: service_healthy }
        restart: unless-stopped

    api2:
        <<: *api
        # Same image, same env, same volume — the replicas differ in nothing.
    # Explicit one-shot jobs for first deploys and schema upgrades. They use the API
    # build stage because it contains the TypeScript sources and migration tooling.
    migrate: &migrate
        build:
            context: ..
            dockerfile: apps/api/Dockerfile
            target: build
        environment: *api-env
        volumes: ['recordings:/var/lib/live-commerce/recordings']
        depends_on:
            postgres: { condition: service_healthy }
            redis: { condition: service_healthy }
        command: ['node', '--import', 'tsx', 'apps/api/src/db/push.ts']
        profiles: [tools]
        restart: 'no'

    seed:
        <<: *migrate
        command: ['node', '--import', 'tsx', 'apps/api/src/db/seed.ts']

    ai1: &ai
        build:
            context: ..
            dockerfile: apps/ai-service/Dockerfile
        environment:
            <<: *api-env
            PORT: 8790
        depends_on:
            postgres: { condition: service_healthy }
            redis: { condition: service_healthy }
        restart: unless-stopped

    ai2:
        <<: *ai

    worker: &worker
        build:
            context: ..
            dockerfile: apps/worker/Dockerfile
        environment: *api-env
        volumes: ['recordings:/var/lib/live-commerce/recordings']
        depends_on:
            postgres: { condition: service_healthy }
            redis: { condition: service_healthy }
        restart: unless-stopped
        healthcheck:
            disable: true

    worker2:
        <<: *worker

    sse1: &sse
        build:
            context: ..
            dockerfile: apps/sse-gateway/Dockerfile
        environment:
            <<: *api-env
            PORT: 8789
        depends_on:
            postgres: { condition: service_healthy }
            redis: { condition: service_healthy }
        restart: unless-stopped

    sse2:
        <<: *sse
        # Same image, same env — nginx round-robins long-lived SSE connections.

    opensearch:
        profiles: [opensearch]
        image: opensearchproject/opensearch:2.17.0
        environment:
            discovery.type: single-node
            plugins.security.disabled: 'true'
            OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['127.0.0.1:9200:9200']
        healthcheck:
            test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health || exit 1']
            interval: 10s
            timeout: 5s
            retries: 12

    nginx:
        image: nginx:1.27-alpine
        ports: ['127.0.0.1:8080:8080']
        volumes:
            - ./nginx.compose.conf:/etc/nginx/nginx.conf:ro
            # Read-only here: nginx serves the recordings the API replicas and the worker
            # retention loop write and delete.
            - recordings:/var/lib/live-commerce/recordings:ro
        depends_on: [api1, api2, ai1, ai2, sse1, sse2]
        restart: unless-stopped

volumes:
    pgdata:
    redisdata:
    # ONE recordings volume, shared by api1, api2, worker replicas and nginx.
    recordings:
