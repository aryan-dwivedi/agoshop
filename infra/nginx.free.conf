# Single-container edge for Render free tier. LISTEN_PORT is substituted at boot.
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 512m;

  upstream api_upstream {
    server 127.0.0.1:8787;
    keepalive 32;
  }

  upstream sse_upstream {
    server 127.0.0.1:8789;
    keepalive 32;
  }

  server {
    listen __LISTEN_PORT__ default_server;
    server_name _;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /media/recordings/ {
      alias /tmp/recordings/;
      add_header Cache-Control "public, max-age=60";
      add_header Access-Control-Allow-Origin "*";
    }

    location /api/events {
      proxy_pass http://sse_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/api/ai/convo/[^/]+/chat/completions$ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ai/tts/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 120s;
    }

    location = /mcp {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 120s;
    }

    location /media/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 120s;
    }

    location /assets/ {
      root /srv/customer;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /studio/assets/ {
      alias /srv/seller/assets/;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /support/assets/ {
      alias /srv/support/assets/;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /studio {
      return 301 /studio/;
    }

    location = /studio/seller.html {
      alias /srv/seller/seller.html;
    }

    # Trailing slash maps to an existing directory via alias; without this, nginx
    # returns 403 before try_files can fall back to the SPA shell.
    location = /studio/ {
      alias /srv/seller/seller.html;
    }

    location /studio/ {
      alias /srv/seller/;
      try_files $uri /studio/seller.html;
    }

    location = /support {
      return 301 /support/;
    }

    location = /support/support.html {
      alias /srv/support/support.html;
    }

    location = /support/ {
      alias /srv/support/support.html;
    }

    location /support/ {
      alias /srv/support/;
      try_files $uri /support/support.html;
    }

    location / {
      root /srv/customer;
      try_files $uri $uri/ /index.html;
    }
  }
}
