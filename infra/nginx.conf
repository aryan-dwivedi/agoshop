# Load balancer for the two-replica stack. This is the portable (Docker) artifact;
# `scripts/stack.mjs` generates the equivalent config for a host without Docker, and
# both give the same topology: two stateless API replicas, a dedicated SSE gateway pool,
# one shared Redis, one shared Postgres, and ONE shared recordings volume served directly from here.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # Browser MediaRecorder uploads (multer disk storage, 500 MB ceiling).
  client_max_body_size 512m;

  # nginx's bundled mime.types already maps m3u8 -> application/vnd.apple.mpegurl and
  # ts -> video/mp2t, so the HLS ladder plays without a local `types` override.

  # Round-robin. Both replicas are stateless — sessions live in Redis, recordings on the
  # shared volume — so any request may land on either, which is what k6 L2 measures.
  upstream api {
    server api1:8787 max_fails=3 fail_timeout=10s;
    server api2:8787 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  # AI hot path — custom-LLM callbacks and TTS scale independently of the API replicas.
  upstream ai_pool {
    server ai1:8790 max_fails=3 fail_timeout=10s;
    server ai2:8790 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  upstream sse_pool {
    server sse1:8789 max_fails=3 fail_timeout=10s;
    server sse2:8789 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  server {
    listen 8080;
    server_name _;

    # Recordings and the simulated-origin HLS ladder come straight off the shared
    # volume, so replay never depends on which replica accepted the upload.
    location /media/recordings/ {
      alias /var/lib/live-commerce/recordings/;
      add_header Cache-Control "public, max-age=60";
      add_header Access-Control-Allow-Origin "*";
      autoindex off;
    }

    # SSE: buffering would hold events until the connection closed.
    location /api/events {
      proxy_pass http://sse_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Agora's custom-LLM callback is a streamed SSE response. Buffering it would make
    # the agent wait for the whole completion before speaking a word.
    location ~ ^/api/ai/convo/[^/]+/chat/completions$ {
      proxy_pass http://ai_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ai/tts/ {
      proxy_pass http://ai_pool;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 120s;
    }

    # Agora MCP tool calls — must not buffer.
    location = /mcp {
      proxy_pass http://ai_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ai/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 120s;
    }
  }
}
