# Load balancer for the two-replica docker-compose stack.

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 512m;

  upstream api {
    server api1:8787 max_fails=3 fail_timeout=10s;
    server api2:8787 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  upstream ai_pool {
    server ai1:8790 max_fails=3 fail_timeout=10s;
    server ai2:8790 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  upstream sse_pool {
    server sse1:8789 max_fails=3 fail_timeout=10s;
    server sse2:8789 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  server {
    listen 8080;
    server_name _;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /media/recordings/ {
      alias /var/lib/live-commerce/recordings/;
      add_header Cache-Control "public, max-age=60";
      add_header Access-Control-Allow-Origin "*";
      autoindex off;
    }

    location /api/events {
      proxy_pass http://sse_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/api/ai/convo/[^/]+/chat/completions$ {
      proxy_pass http://ai_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ai/tts/ {
      proxy_pass http://ai_pool;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 120s;
    }

    location = /mcp {
      proxy_pass http://ai_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ai/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 120s;
    }
  }
}
