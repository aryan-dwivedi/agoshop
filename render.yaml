# Render Blueprint (free tier).
# One public web service runs API, SSE, worker, and the static edge in a single
# container. Postgres and Key Value use Render's free datastore plans.
#
# Limitations:
# - Services spin down after ~15 minutes of inactivity (cold starts ~1 minute).
# - Free Postgres expires 30 days after creation (upgrade to keep data).
# - No persistent disk; session recordings are ephemeral.
# - 512 MB RAM: voice uses Agora-managed ASR/LLM/TTS; /mcp is served in-process.
services:
    - type: web
      runtime: docker
      name: agoshop
      region: singapore
      plan: free
      dockerfilePath: ./infra/Dockerfile.free
      dockerContext: .
      healthCheckPath: /api/health/live
      envVars:
          - fromGroup: agoshop-runtime-free
          - key: DATABASE_URL
            fromDatabase:
                name: agoshop-db
                property: connectionString
          - key: REDIS_URL
            fromService:
                type: keyvalue
                name: agoshop-redis
                property: connectionString
          - key: PUBLIC_API_URL
            fromService:
                type: web
                name: agoshop
                envVarKey: RENDER_EXTERNAL_URL
          - key: WEB_ORIGIN
            fromService:
                type: web
                name: agoshop
                envVarKey: RENDER_EXTERNAL_URL

    - type: keyvalue
      name: agoshop-redis
      region: singapore
      plan: free
      ipAllowList: []
      maxmemoryPolicy: allkeys-lru
      persistenceMode: off

databases:
    - name: agoshop-db
      region: singapore
      plan: free
      databaseName: agoshop
      user: agoshop
      postgresMajorVersion: '16'
      ipAllowList: []

envVarGroups:
    - name: agoshop-runtime-free
      envVars:
          - key: NODE_ENV
            value: production
          - key: SESSION_COOKIE_SECRET
            generateValue: true
          - key: CONVO_LLM_SHARED_SECRET
            generateValue: true
          - key: MCP_STATIC_API_KEY
            sync: false
          - key: MCP_SERVER_NAME
            value: shop
          - key: AGORA_APP_ID
            sync: false
          - key: AGORA_APP_CERTIFICATE
            sync: false
          - key: AGORA_CUSTOMER_ID
            sync: false
          - key: AGORA_CUSTOMER_SECRET
            sync: false
          - key: AGORA_STUDIO_PIPELINE_ID
            sync: false
          - key: AGORA_WEBHOOK_SECRET
            sync: false
          - key: LLM_PROVIDER
            value: mock
          - key: LLM_API_KEY
            sync: false
          - key: RECORDING_PROVIDER
            value: browser
          - key: RECORDING_LOCAL_DIR
            value: /tmp/recordings
          - key: TRANSCRIPTION_PROVIDER
            value: agora
          - key: TRANSCRIPTION_LANGUAGES
            value: en-US,hi-IN,es-ES
          - key: PG_POOL_MAX
            value: '5'
          - key: NODE_OPTIONS
            value: '--max-old-space-size=256'
          - key: MEDIA_GATEWAY_ENABLED
            value: 'true'
          - key: MEDIA_GATEWAY_REGION
            value: ap
