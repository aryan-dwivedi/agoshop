services:
  - type: web
    runtime: docker
    name: agoshop
    region: singapore
    plan: starter
    dockerfilePath: ./infra/Dockerfile.edge
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: API_UPSTREAM
        fromService:
          type: pserv
          name: agoshop-api
          property: hostport
      - key: AI_UPSTREAM
        fromService:
          type: pserv
          name: agoshop-ai
          property: hostport
      - key: SSE_UPSTREAM
        fromService:
          type: pserv
          name: agoshop-sse
          property: hostport

  - type: pserv
    runtime: docker
    name: agoshop-api
    region: singapore
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/live
    preDeployCommand: node apps/api/dist/db-push.js
    initialDeployHook: node apps/api/dist/db-seed.js
    maxShutdownDelaySeconds: 120
    disk:
      name: recordings
      mountPath: /var/lib/live-commerce/recordings
      sizeGB: 10
    envVars:
      - fromGroup: agoshop-runtime
      - key: DATABASE_URL
        fromDatabase:
          name: agoshop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agoshop-redis
          property: connectionString

  - type: pserv
    runtime: docker
    name: agoshop-ai
    region: singapore
    plan: standard
    dockerfilePath: ./apps/ai-service/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: agoshop-runtime
      - key: DATABASE_URL
        fromDatabase:
          name: agoshop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agoshop-redis
          property: connectionString

  - type: pserv
    runtime: docker
    name: agoshop-sse
    region: singapore
    plan: starter
    dockerfilePath: ./apps/sse-gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /metrics
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: agoshop-runtime
      - key: DATABASE_URL
        fromDatabase:
          name: agoshop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agoshop-redis
          property: connectionString

  - type: worker
    runtime: docker
    name: agoshop-worker
    region: singapore
    plan: starter
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: agoshop-runtime
      - key: DATABASE_URL
        fromDatabase:
          name: agoshop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agoshop-redis
          property: connectionString
      - key: RECORDING_LOCAL_FILE_PURGE
        value: 'false'

  - type: keyvalue
    name: agoshop-redis
    region: singapore
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: agoshop-db
    region: singapore
    plan: basic-1gb
    databaseName: agoshop
    user: agoshop
    postgresMajorVersion: '16'
    ipAllowList: []

envVarGroups:
  - name: agoshop-runtime
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_API_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: SESSION_COOKIE_SECRET
        generateValue: true
      - key: CONVO_LLM_SHARED_SECRET
        generateValue: true
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: AGORA_CUSTOMER_ID
        sync: false
      - key: AGORA_CUSTOMER_SECRET
        sync: false
      - key: AGORA_WEBHOOK_SECRET
        sync: false
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-4o-mini
      - key: CONVOAI_ENABLED
        value: 'true'
      - key: CONVOAI_LLM_MODE
        value: custom
      - key: CONVOAI_ASR_CREDENTIAL_MODE
        value: byok
      - key: CONVOAI_TTS_CREDENTIAL_MODE
        value: byok
      - key: RECORDING_PROVIDER
        value: browser
      - key: RECORDING_LOCAL_DIR
        value: /var/lib/live-commerce/recordings
      - key: RECORDING_LOCAL_FILE_PURGE
        value: 'true'
      - key: SEARCH_PROVIDER
        value: postgres
      - key: CHECKOUT_MODE
        value: async
      - key: PRIVACY_MODE
        value: standard
      - key: PII_REDACTION
        value: 'true'
